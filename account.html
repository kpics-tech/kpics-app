<style>
:root{
  --orange:#E8A020; --orange-light:#F5B84A; --orange-bg:rgba(232,160,32,0.08);
  --black:#0C0C0C; --dark:#141414; --card:#1A1A1A; --border:#2A2A2A; --border-light:#333;
  --text:#F0F0F0; --text-muted:#888; --text-dim:#555;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--black);}
body{color:var(--text);font-family:"Noto Sans JP",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:4px;height:4px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
.fade-up{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;}
#splash{position:fixed;inset:0;background:var(--black);z-index:900;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease, visibility .45s ease;}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo-img{width:110px;animation:scaleIn .5s cubic-bezier(.16,1,.3,1) both;filter:drop-shadow(0 8px 30px rgba(232,160,32,.25));}
.top-header{position:sticky;top:0;z-index:50;background:var(--dark);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top) 16px 0;}
.top-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;height:54px;gap:12px;}
.back-btn{display:flex;align-items:center;gap:5px;color:var(--text-muted);text-decoration:none;font-size:12.5px;font-weight:600;transition:color .15s;}
.back-btn:hover{color:var(--orange);}
.top-title{flex:1;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:.05em;text-align:center;}
.top-logo{height:24px;width:auto;}
.main{max-width:520px;margin:0 auto;padding:26px 20px 90px;}
.hero{text-align:center;padding:6px 10px 24px;}
.hero-icon{width:60px;height:60px;border-radius:16px;background:var(--orange-bg);border:1px solid rgba(232,160,32,.25);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;}
.hero-title{font-weight:900;font-size:20px;line-height:1.5;margin-bottom:8px;}
.hero-desc{font-size:12.5px;color:var(--text-muted);line-height:1.8;}

.acct-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 18px;opacity:0;transition:opacity .3s;}
.acct-card.ready{opacity:1;}
.field-label{font-size:11.5px;font-weight:700;color:var(--text-muted);letter-spacing:.02em;margin:16px 0 7px;}
.field-label:first-child{margin-top:0;}
.field{width:100%;background:var(--black);border:1px solid var(--border-light);border-radius:10px;padding:12px 13px;color:var(--text);font-size:14.5px;font-family:inherit;-webkit-appearance:none;appearance:none;}
.field:focus{outline:none;border-color:var(--orange);}
select.field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px;}
.field-static{display:flex;align-items:center;background:rgba(255,255,255,.02);border:1px dashed var(--border-light);border-radius:10px;padding:12px 13px;color:var(--text-muted);font-size:13.5px;min-height:44px;word-break:break-all;}
.field-hint{font-size:10.5px;color:var(--text-dim);margin-top:6px;line-height:1.6;}
.save-btn{width:100%;margin-top:22px;background:var(--orange);color:#1a1200;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;transition:opacity .15s;}
.save-btn:active{opacity:.8;}
.save-btn:disabled{opacity:.55;cursor:default;}
.acct-msg{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-size:12.5px;line-height:1.6;text-align:center;}
.acct-msg.show{display:block;}
.acct-msg.ok{background:rgba(80,200,120,.12);border:1px solid rgba(80,200,120,.4);color:#7fe0a0;}
.acct-msg.err{background:rgba(240,96,96,.1);border:1px solid rgba(240,96,96,.4);color:#f08080;}
.logout-row{text-align:center;margin-top:26px;}
.logout-link{background:none;border:none;color:var(--text-dim);font-size:12px;font-family:inherit;text-decoration:underline;cursor:pointer;}
.logout-link:active{color:var(--text-muted);}
.footer-note{text-align:center;font-size:11px;color:var(--text-dim);margin-top:30px;line-height:1.8;}
.footer-note img{height:16px;width:auto;display:inline-block;vertical-align:middle;opacity:.5;margin-right:5px;}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:300;background:rgba(20,20,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;align-items:stretch;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);}
.tabbar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;color:var(--text-dim);text-decoration:none;cursor:pointer;transition:color .15s;-webkit-tap-highlight-color:transparent;background:none;border:none;font-family:inherit;}
.tabbar-item svg{width:21px;height:21px;}
.tabbar-item .tb-label{font-size:10px;font-weight:700;letter-spacing:.02em;}
.tabbar-item.active{color:var(--orange);}
.tabbar-item:active{opacity:.7;}
</style>
</head>
<body>

<div id="splash"><img class="splash-logo-img" src="assets/logo-icon-dark.png" alt="K-PICS"></div>

<header class="top-header">
  <div class="top-inner">
    <a class="back-btn" href="other.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      その他
    </a>
    <div class="top-title">アカウント設定</div>
    <img class="top-logo" src="assets/logo-icon-dark.png" alt="K-PICS">
  </div>
</header>

<div class="main fade-up">
  <div class="hero">
    <div class="hero-icon">👤</div>
    <div class="hero-title">アカウント設定</div>
    <div class="hero-desc">登録している名前・学年を変更できます。</div>
  </div>

  <div class="acct-card" id="acct-card">
    <div class="field-label">メールアドレス</div>
    <div class="field-static" id="acct-email">—</div>
    <div class="field-hint">メールアドレスの変更は現在このページでは行えません。</div>

    <div class="field-label">名前</div>
    <input class="field" type="text" id="acct-name" placeholder="山田 太郎" autocomplete="name">

    <div class="field-label">学年</div>
    <select class="field" id="acct-year">
      <option value="">未設定</option>
      <option value="1">1年</option>
      <option value="2">2年</option>
      <option value="3">3年</option>
      <option value="4">4年</option>
      <option value="5">5年</option>
      <option value="6">6年</option>
      <option value="7">先生</option>
      <option value="8">その他</option>
    </select>

    <div class="field-label">区分</div>
    <div class="field-static" id="acct-role">—</div>

    <button class="save-btn" id="acct-save" onclick="saveAccount()">保存する</button>
    <div class="acct-msg" id="acct-msg"></div>
  </div>

  <div class="acct-card ready" id="role-switch-card" style="margin-top:16px;display:none;">
    <div class="field-label" style="margin-top:0;">確認者への切り替え</div>
    <div class="field-hint" style="margin-top:0;margin-bottom:2px;">招待コードを入力すると、このアカウントのまま確認者に切り替わります。</div>
    <div class="field-label">招待コード</div>
    <input class="field" type="text" id="role-invite" placeholder="招待コード">
    <button class="save-btn" id="role-switch-btn" onclick="switchToReviewer()">確認者に切り替える</button>
    <div class="acct-msg" id="role-msg"></div>
  </div>

  <div class="acct-card ready" id="pw-card" style="margin-top:16px;">
    <div class="field-label" style="margin-top:0;">パスワードの変更</div>
    <div class="field-hint" style="margin-top:0;margin-bottom:2px;">新しいパスワードを入力してください（6文字以上）。</div>
    <div class="field-label">新しいパスワード</div>
    <input class="field" type="password" id="pw-new" placeholder="新しいパスワード" autocomplete="new-password">
    <div class="field-label">新しいパスワード（確認）</div>
    <input class="field" type="password" id="pw-new-confirm" placeholder="もう一度入力" autocomplete="new-password">
    <button class="save-btn" id="pw-save" onclick="changePassword()">パスワードを変更する</button>
    <div class="acct-msg" id="pw-msg"></div>

    <div class="logout-row">
      <button class="logout-link" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <div class="footer-note">
    <img src="assets/logo-icon-dark.png" alt="">K-PICS &nbsp;|&nbsp; 学びを、次の代へ。
  </div>
</div>

<nav class="tabbar" id="main-tabbar">
  <a class="tabbar-item" data-tab="home" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span class="tb-label">ホーム</span>
  </a>
  <a class="tabbar-item" data-tab="manabu" href="manabu.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
    <span class="tb-label">まなぶ</span>
  </a>
  <a class="tabbar-item" data-tab="calendar" href="calendar.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span class="tb-label">カレンダー</span>
  </a>
  <a class="tabbar-item" data-tab="other" href="other.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    <span class="tb-label">その他</span>
  </a>
</nav>

<script src="auth-guard.js"></script>
<script src="tabbar.js"></script>
<script>
async function doLogout(){
  await _supabase.auth.signOut();
  location.href = 'index.html';
}

async function loadAccount(){
  const { data:{ session } } = await _supabase.auth.getSession();
  if(!session || !session.user){ location.href = 'index.html'; return; }
  const user = session.user;
  window.CURRENT_UID = user.id;

  document.getElementById('acct-email').textContent = user.email || '—';

  const { data:profile, error } = await _supabase.from('profiles').select('*').eq('id', user.id).single();
  const msg = document.getElementById('acct-msg');
  if(error && error.code !== 'PGRST116'){
    msg.textContent = 'プロフィールの読み込みに失敗しました: ' + error.message;
    msg.className = 'acct-msg err show';
  }

  document.getElementById('acct-name').value = (profile && profile.name) ? profile.name : '';
  const y = profile ? profile.year : null;
  document.getElementById('acct-year').value = (y === null || y === undefined || y === '') ? '' : String(y);
  const role = (profile && profile.role) ? profile.role : 'member';
  document.getElementById('acct-role').textContent = (role === 'reviewer') ? '確認者' : '部員';
  document.getElementById('role-switch-card').style.display = (role === 'member') ? '' : 'none';

  document.getElementById('acct-card').classList.add('ready');
  document.getElementById('splash').classList.add('hide');
}

async function saveAccount(){
  const uid = window.CURRENT_UID;
  const msg = document.getElementById('acct-msg');
  msg.className = 'acct-msg';
  if(!uid){ location.href = 'index.html'; return; }

  const name = document.getElementById('acct-name').value.trim();
  const yearRaw = document.getElementById('acct-year').value;
  if(!name){
    msg.textContent = '名前を入力してください';
    msg.className = 'acct-msg err show';
    return;
  }
  const year = (yearRaw === '') ? null : parseInt(yearRaw, 10);

  const btn = document.getElementById('acct-save');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '保存中...';

  const { error } = await _supabase.from('profiles').update({ name: name, year: year }).eq('id', uid);

  btn.disabled = false;
  btn.textContent = orig;

  if(error){
    msg.textContent = '保存に失敗しました: ' + error.message;
    msg.className = 'acct-msg err show';
    return;
  }
  msg.textContent = '保存しました ✓';
  msg.className = 'acct-msg ok show';
}

const REVIEWER_INVITE_CODE = 'KPICS-REVIEWER-2026'; // 認定アプリと同じ招待コード

async function switchToReviewer(){
  const code = document.getElementById('role-invite').value.trim();
  const msg = document.getElementById('role-msg');
  msg.className = 'acct-msg';
  if(!code){
    msg.textContent = '招待コードを入力してください';
    msg.className = 'acct-msg err show';
    return;
  }
  if(code !== REVIEWER_INVITE_CODE){
    msg.textContent = '招待コードが正しくありません';
    msg.className = 'acct-msg err show';
    return;
  }
  const uid = window.CURRENT_UID;
  if(!uid){ location.href = 'index.html'; return; }

  const btn = document.getElementById('role-switch-btn');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '切り替え中...';

  // 【2026-08 修正】招待コードのチェックをDB側の関数に任せるようにした。
  // 以前は profiles.role をブラウザから直接書き換えていたため、
  // コードを知らなくても直接更新すれば確認者になれてしまっていた。
  const { error } = await _supabase.rpc('claim_reviewer_role', { invite_code: code });

  btn.disabled = false;
  btn.textContent = orig;

  if(error){
    msg.textContent = '切り替えに失敗しました: ' + error.message;
    msg.className = 'acct-msg err show';
    return;
  }
  msg.textContent = '確認者に切り替わりました ✓（次回ログイン時から反映されます）';
  msg.className = 'acct-msg ok show';
  document.getElementById('acct-role').textContent = '確認者';
  document.getElementById('role-switch-card').style.display = 'none';
}

async function changePassword(){
  const msg = document.getElementById('pw-msg');
  msg.className = 'acct-msg';

  const pw  = document.getElementById('pw-new').value;
  const pw2 = document.getElementById('pw-new-confirm').value;

  if(!pw || !pw2){
    msg.textContent = 'パスワードを入力してください';
    msg.className = 'acct-msg err show';
    return;
  }
  if(pw.length < 6){
    msg.textContent = 'パスワードは6文字以上にしてください';
    msg.className = 'acct-msg err show';
    return;
  }
  if(pw !== pw2){
    msg.textContent = 'パスワードが一致しません';
    msg.className = 'acct-msg err show';
    return;
  }

  const btn = document.getElementById('pw-save');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '変更中...';

  const { error } = await _supabase.auth.updateUser({ password: pw });

  btn.disabled = false;
  btn.textContent = orig;

  if(error){
    msg.textContent = '変更に失敗しました: ' + error.message;
    msg.className = 'acct-msg err show';
    return;
  }
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-new-confirm').value = '';
  msg.textContent = 'パスワードを変更しました ✓';
  msg.className = 'acct-msg ok show';
}

loadAccount();
</script>
</body>
</html>
