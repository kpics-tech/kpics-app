<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>パスワード再設定 | K-PICS</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0C0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K-PICS">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://iarbwehytrdxuhyedsvi.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_KyOX0XzlSVLRklBmlOfi7A_sbUtfhha';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<style>
:root{
  --orange:#E8A020; --orange-light:#F5B84A;
  --black:#0C0C0C; --dark:#141414; --card:#1A1A1A; --border:#2A2A2A; --border-light:#333;
  --text:#F0F0F0; --text-muted:#888; --text-dim:#555;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--black);}
body{
  color:var(--text);font-family:"Noto Sans JP",sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{width:100%;max-width:380px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;text-align:center;}
.hero img{width:64px;}
.hero .name{font-family:"Bebas Neue",sans-serif;font-size:30px;letter-spacing:.08em;color:var(--text);}
.hero .sub{font-size:12px;color:var(--text-muted);letter-spacing:.02em;}
.box{background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:26px 22px;width:100%;}
.box-title{font-size:16px;font-weight:800;margin-bottom:8px;}
.box-desc{font-size:12px;color:var(--text-muted);line-height:1.7;margin-bottom:6px;}
.field-label{font-size:11px;color:var(--text-muted);margin-bottom:5px;margin-top:14px;}
.field{
  background:var(--black);border:1px solid var(--border-light);border-radius:7px;
  color:var(--text);padding:11px 13px;font-size:14px;width:100%;
  font-family:"Noto Sans JP",sans-serif;outline:none;transition:border-color .15s;
}
.field:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,160,32,.12);}
.field::placeholder{color:var(--text-dim);}
.msg{
  font-size:11.5px;border-radius:6px;padding:9px 11px;margin-top:12px;display:none;line-height:1.5;
}
.msg.show{display:block;}
.msg.err{color:#F06060;background:rgba(240,96,96,.1);border:1px solid rgba(240,96,96,.3);}
.msg.ok{color:#7fe0a0;background:rgba(80,200,120,.12);border:1px solid rgba(80,200,120,.4);}
.btn{
  width:100%;margin-top:18px;padding:14px;
  font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:.1em;
  border:none;border-radius:8px;cursor:pointer;
  background:var(--orange);color:var(--black);transition:all .2s;
}
.btn:hover{background:var(--orange-light);transform:translateY(-1px);}
.btn:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;transform:none;}
.link-back{
  display:block;text-align:center;margin-top:18px;font-size:12px;color:var(--text-dim);
  text-decoration:underline;
}
.state{display:none;}
.state.show{display:block;}
.spinner{
  width:28px;height:28px;border:3px solid var(--border-light);border-top-color:var(--orange);
  border-radius:50%;margin:6px auto 0;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="wrap fade-up">
  <div class="hero">
    <img src="assets/logo-icon-dark.png" alt="K-PICS">
    <div class="name">K-PICS</div>
    <div class="sub">部員専用ポータル</div>
  </div>

  <div class="box">
    <!-- 確認中 -->
    <div class="state show" id="state-loading">
      <div class="box-title">確認しています…</div>
      <div class="box-desc">メール内のリンクを確認しています。少しお待ちください。</div>
      <div class="spinner"></div>
    </div>

    <!-- リンク無効／期限切れ -->
    <div class="state" id="state-invalid">
      <div class="box-title">リンクが無効です</div>
      <div class="box-desc">このリンクは無効か、有効期限が切れています。お手数ですが、ログイン画面から「パスワードをお忘れですか？」よりもう一度お試しください。</div>
      <a class="link-back" href="index.html">ログイン画面に戻る</a>
    </div>

    <!-- 新しいパスワード入力 -->
    <div class="state" id="state-form">
      <div class="box-title">新しいパスワードを設定</div>
      <div class="box-desc">ご自身で新しいパスワードを決めてください。</div>
      <div class="field-label">新しいパスワード（6文字以上）</div>
      <input class="field" type="password" id="new-password" placeholder="新しいパスワード" autocomplete="new-password">
      <div class="field-label">新しいパスワード（確認）</div>
      <input class="field" type="password" id="new-password-confirm" placeholder="もう一度入力" autocomplete="new-password">
      <div class="msg err" id="form-error"></div>
      <button class="btn" id="submit-btn" onclick="submitNewPassword()">パスワードを変更する</button>
    </div>

    <!-- 完了 -->
    <div class="state" id="state-done">
      <div class="box-title">変更が完了しました</div>
      <div class="msg ok show">新しいパスワードを設定しました。このままK-PICSをご利用いただけます。</div>
      <a class="link-back" href="index.html">K-PICSを開く</a>
    </div>
  </div>
</div>

<script>
function showState(id){
  ['state-loading','state-invalid','state-form','state-done'].forEach(s=>{
    document.getElementById(s).classList.toggle('show', s===id);
  });
}

let _handled = false;
async function checkRecoverySession(){
  const { data:{ session } } = await _supabase.auth.getSession();
  if(session){
    _handled = true;
    showState('state-form');
  }
}

_supabase.auth.onAuthStateChange((event, session) => {
  if(session && !_handled){
    _handled = true;
    showState('state-form');
  }
});

checkRecoverySession();

// 数秒待っても有効なセッションが確認できなければ、リンク無効として案内する
setTimeout(()=>{
  if(!_handled) showState('state-invalid');
}, 4000);

async function submitNewPassword(){
  const pw  = document.getElementById('new-password').value;
  const pw2 = document.getElementById('new-password-confirm').value;
  const errEl = document.getElementById('form-error');
  const btn = document.getElementById('submit-btn');
  errEl.classList.remove('show');

  if(!pw || !pw2){ errEl.textContent='パスワードを入力してください'; errEl.classList.add('show'); return; }
  if(pw.length < 6){ errEl.textContent='パスワードは6文字以上にしてください'; errEl.classList.add('show'); return; }
  if(pw !== pw2){ errEl.textContent='パスワードが一致しません'; errEl.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = '変更中...';
  const { error } = await _supabase.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = 'パスワードを変更する';

  if(error){
    errEl.textContent = '変更に失敗しました: ' + error.message;
    errEl.classList.add('show');
    return;
  }
  showState('state-done');
}
</script>
</body>
</html>
