<style>
:root{
  --orange:#E8A020;
  --orange-light:#F5B84A;
  --orange-dark:#B87A10;

  --black:#0C0C0C;
  --dark:#141414;

  --card-hover:#202020;
  --border:#2A2A2A;
  --border-light:#333;
  --text:#F0F0F0;
  --text-muted:#888;

}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--black);}
body{color:var(--text);font-family:"Noto Sans JP",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
.bebas{font-family:"Bebas Neue",sans-serif;}

button{font-family:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:var(--black);z-index:900;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s ease, visibility .45s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo-img{width:110px;animation:scaleIn .5s cubic-bezier(.16,1,.3,1) both;filter:drop-shadow(0 8px 30px rgba(232,160,32,.25));}

/* HEADER */
.top-header{
  position:sticky;top:0;z-index:50;background:var(--dark);border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top) 16px 0;
}
.top-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;height:54px;gap:12px;}
.back-btn{
  display:flex;align-items:center;gap:5px;color:var(--text-muted);text-decoration:none;
  font-size:12.5px;font-weight:600;transition:color .15s;white-space:nowrap;
}
.back-btn:hover{color:var(--orange);}
.top-title{flex:1;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:.05em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-logo{height:24px;width:auto;flex-shrink:0;}

.main{max-width:640px;margin:0 auto;padding:26px 20px 100px;}

.doc-hero{text-align:center;padding:10px 10px 24px;}
.doc-hero-icon{
  width:64px;height:64px;border-radius:16px;background:var(--orange-bg);border:1px solid rgba(232,160,32,.25);
  display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;
}
.doc-hero-title{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:20px;line-height:1.5;margin-bottom:8px;}
.doc-hero-desc{font-size:12.5px;color:var(--text-muted);line-height:1.85;max-width:440px;margin:0 auto;}

/* 検索 */
.search-box{
  position:relative;margin-bottom:14px;
}
.search-box input{
  width:100%;background:var(--card);border:1px solid var(--border-light);border-radius:12px;
  color:var(--text);font-size:14px;padding:13px 14px 13px 40px;font-family:inherit;
}
.search-box input::placeholder{color:var(--text-dim);}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-dim);pointer-events:none;}

/* カテゴリチップ */
.chip-row{display:flex;gap:7px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;background:var(--card);border:1px solid var(--border-light);color:var(--text-muted);
  border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:all .15s;
}
.chip.active{background:var(--orange-bg);border-color:rgba(232,160,32,.4);color:var(--orange);}

/* 用語カード */
.term-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.term-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  text-decoration:none;color:var(--text);transition:all .15s;
}
.term-card:hover{background:var(--card-hover);border-color:var(--border-light);}
.term-card:active{transform:scale(.98);}
.term-card-body{flex:1;min-width:0;}
.term-card-name{font-size:15.5px;font-weight:700;margin-bottom:3px;}
.term-card-reading{font-size:10.5px;color:var(--text-dim);font-family:"JetBrains Mono",monospace;margin-bottom:4px;}
.term-card-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);}
.term-card-cat{

  background:var(--orange-bg);border:1px solid rgba(232,160,32,.25);border-radius:6px;padding:2px 7px;
}
.term-card-chevron{color:var(--text-dim);flex-shrink:0;}
.term-card-chevron svg{width:18px;height:18px;}

.loading-msg, .empty-msg{
  text-align:center;color:var(--text-muted);font-size:12.5px;padding:30px 10px;line-height:1.8;

/* FAB */
.add-term-fab{

  display:flex;align-items:center;gap:8px;
  background:var(--orange);color:var(--black);border:none;border-radius:26px;

.add-term-fab:hover{background:var(--orange-light);transform:translateY(-1px);}
.add-term-fab svg{width:17px;height:17px;}

.doc-note{
  font-size:11.5px;color:var(--text-dim);line-height:1.8;text-align:center;
  background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-top:6px;
}
.doc-note strong{color:var(--text-muted);}

.footer-note{
  text-align:center;font-size:11px;color:var(--text-dim);margin-top:36px;line-height:1.8;
}
.footer-note img{height:16px;width:auto;display:inline-block;vertical-align:middle;opacity:.5;margin-right:5px;}

/* モーダル */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--card);border:1px solid var(--border-light);border-radius:16px;
  width:100%;max-width:400px;padding:24px 22px;animation:scaleIn .25s cubic-bezier(.16,1,.3,1) both;

.modal-title{font-size:16px;font-weight:900;margin-bottom:18px;}
.modal-label{font-size:11.5px;color:var(--text-muted);font-weight:700;margin-bottom:7px;display:block;}
.modal-input, .modal-select, .modal-textarea{

.modal-textarea{resize:vertical;min-height:70px;line-height:1.7;}
.modal-select{appearance:none;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-btn{

.modal-btn.cancel{background:transparent;border:1px solid var(--border-light);color:var(--text-muted);}
.modal-btn.confirm{background:var(--orange);color:var(--black);}
.modal-btn.confirm:disabled{opacity:.5;}

.tabbar-item .tb-label{font-size:10px;font-weight:700;letter-spacing:.02em;}
.tabbar-item.active{color:var(--orange);}
.tabbar-item:active{opacity:.7;}
</style>

<script>
window.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){ document.getElementById('splash').classList.add('hide'); }, 500);
});

// ===================== データ取得 =====================
let ALL_TERMS = [];
let ENTRY_COUNTS = {}; // term_id -> count
let CURRENT_CATEGORY = '';
let MY_NAME = null;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function getMyName(){
  if(MY_NAME) return MY_NAME;
  if(!window.CURRENT_UID) return '名無しさん';
  const { data } = await _supabase.from('profiles').select('name').eq('id', window.CURRENT_UID).single();
  MY_NAME = (data && data.name) ? data.name : '名無しさん';
  return MY_NAME;
}

async function loadTerms(){
  const { data, error } = await _supabase
    .from('wiki_terms')
    .select('id, term, reading, category, created_at');

  if(error){
    document.getElementById('term-list').innerHTML =
      '<div class="empty-msg">読み込みに失敗しました：' + escapeHtml(error.message) + '</div>';
    return;
  }
  ALL_TERMS = data || [];

  const { data: entryRows } = await _supabase.from('wiki_entries').select('term_id');
  ENTRY_COUNTS = {};
  (entryRows || []).forEach(r => { ENTRY_COUNTS[r.term_id] = (ENTRY_COUNTS[r.term_id] || 0) + 1; });

  renderList();
}

function sortKey(t){ return (t.reading || t.term || '').toString(); }

function renderList(){
  const listEl = document.getElementById('term-list');
  const q = (document.getElementById('search-input').value || '').trim().toLowerCase();

  let filtered = ALL_TERMS.filter(t => {
    if(CURRENT_CATEGORY && (t.category || '') !== CURRENT_CATEGORY) return false;
    if(!q) return true;
    const hay = ((t.term || '') + ' ' + (t.reading || '')).toLowerCase();
    return hay.includes(q);
  });

  filtered.sort((a, b) => sortKey(a).localeCompare(sortKey(b), 'ja'));

  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty-msg">' +
      (ALL_TERMS.length === 0 ? 'まだ用語が登録されていません。<br>「＋ 用語を追加」から最初の用語を登録してみましょう。' : '該当する用語が見つかりませんでした') +
      '</div>';
    return;
  }

  listEl.innerHTML = filtered.map(t => {
    const count = ENTRY_COUNTS[t.id] || 0;
    const countLabel = count > 0 ? count + '件の解説' : 'まだ解説がありません';
    const catBadge = t.category ? '<span class="term-card-cat">' + escapeHtml(t.category) + '</span>' : '';
    return (
      '<a class="term-card" href="wiki-detail.html?id=' + t.id + '">' +
        '<div class="term-card-body">' +
          '<div class="term-card-name">' + escapeHtml(t.term) + '</div>' +
          (t.reading ? '<div class="term-card-reading">' + escapeHtml(t.reading) + '</div>' : '') +
          '<div class="term-card-meta">' + catBadge + '<span>' + countLabel + '</span></div>' +
        '</div>' +
        '<div class="term-card-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>' +
      '</a>'
    );
  }).join('');
}

document.getElementById('search-input').addEventListener('input', renderList);

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    CURRENT_CATEGORY = chip.dataset.cat;
    renderList();
  });
});

// ===================== 用語追加 =====================
document.getElementById('add-term-btn').addEventListener('click', () => {
  document.getElementById('term-input').value = '';
  document.getElementById('reading-input').value = '';
  document.getElementById('category-input').value = '';
  document.getElementById('add-error').style.display = 'none';
  document.getElementById('add-modal').classList.add('show');
  setTimeout(() => document.getElementById('term-input').focus(), 50);
});
document.getElementById('add-cancel-btn').addEventListener('click', () => {
  document.getElementById('add-modal').classList.remove('show');
});

document.getElementById('add-confirm-btn').addEventListener('click', async () => {
  const term = document.getElementById('term-input').value.trim();
  const reading = document.getElementById('reading-input').value.trim();
  const category = document.getElementById('category-input').value;
  const errEl = document.getElementById('add-error');

  if(!term){
    errEl.textContent = '用語を入力してください';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('add-confirm-btn');
  btn.disabled = true;
  btn.textContent = '追加中…';

  const name = await getMyName();
  const { data, error } = await _supabase.from('wiki_terms').insert({
    term: term,
    reading: reading || null,
    category: category || null,
    created_by: window.CURRENT_UID || null,
    created_by_name: name
  }).select('id').single();

  btn.disabled = false;
  btn.textContent = '追加する';

  if(error){
    errEl.textContent = '追加に失敗しました：' + error.message;
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('add-modal').classList.remove('show');
  if(data && data.id){
    window.location.href = 'wiki-detail.html?id=' + data.id;
  } else {
    await loadTerms();
  }
});

loadTerms();
</script>
