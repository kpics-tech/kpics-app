<style>
:root{
  --orange:#E8A020;
  --orange-light:#F5B84A;
  --orange-dark:#B87A10;
  --orange-bg:rgba(232,160,32,0.08);
  --black:#0C0C0C;
  --dark:#141414;
  --card:#1A1A1A;
  --card-hover:#202020;
  --border:#2A2A2A;
  --border-light:#333;
  --text:#F0F0F0;
  --text-muted:#888;
  --text-dim:#555;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--black);}
body{color:var(--text);font-family:"Noto Sans JP",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
.bebas{font-family:"Bebas Neue",sans-serif;}
.mono{font-family:"JetBrains Mono",monospace;}
button{font-family:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
.fade-up{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:var(--black);z-index:900;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s ease, visibility .45s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo-img{width:110px;animation:scaleIn .5s cubic-bezier(.16,1,.3,1) both;filter:drop-shadow(0 8px 30px rgba(232,160,32,.25));}

/* HEADER */
.top-header{
  position:sticky;top:0;z-index:50;background:var(--dark);border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top) 16px 0;
}
.top-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;height:54px;gap:12px;}
.back-btn{
  display:flex;align-items:center;gap:5px;color:var(--text-muted);text-decoration:none;
  font-size:12.5px;font-weight:600;transition:color .15s;white-space:nowrap;
}
.back-btn:hover{color:var(--orange);}
.top-title{flex:1;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:.05em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-logo{height:24px;width:auto;flex-shrink:0;}

.main{max-width:640px;margin:0 auto;padding:26px 20px 90px;}

.region-hero{text-align:center;padding:6px 10px 26px;}
.region-hero-title{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:22px;line-height:1.5;margin-bottom:6px;}
.region-hero-desc{font-size:12px;color:var(--text-muted);line-height:1.8;}

.edit-fab{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--orange);color:var(--black);border:none;border-radius:12px;
  padding:14px;font-family:"Bebas Neue",sans-serif;font-size:15px;letter-spacing:.05em;
  cursor:pointer;margin-bottom:22px;transition:all .2s;
}
.edit-fab:hover{background:var(--orange-light);transform:translateY(-1px);}
.edit-fab svg{width:17px;height:17px;}

/* 項目カード */
.item-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;margin-bottom:12px;
}
.item-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.item-card-num{
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--orange);
  background:var(--orange-bg);border:1px solid rgba(232,160,32,.25);
  width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.item-card-label{font-size:13.5px;font-weight:700;}
.item-card-body{
  font-size:13px;line-height:1.85;color:var(--text);white-space:pre-wrap;word-break:break-word;
  padding-left:36px;
}
.item-card-body.empty{color:var(--text-dim);font-style:italic;}

/* ④⑤ セクション共通 */
.tip-section{margin-top:8px;margin-bottom:12px;}
.tip-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;}
.tip-section-title{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;min-width:0;}
.tip-add-btn{
  background:var(--orange-bg);border:1px solid rgba(232,160,32,.3);color:var(--orange);
  font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:8px;cursor:pointer;flex-shrink:0;
}
.tip-add-btn:hover{background:rgba(232,160,32,.18);}
.tip-empty{font-size:12px;color:var(--text-dim);padding:4px 2px 14px;}

/* ④ 画像 */
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;}
.img-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--border);}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.img-thumb .img-del{
  position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:none;
  border-radius:6px;width:22px;height:22px;font-size:13px;cursor:pointer;line-height:1;
}
.img-add-tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;
  border-radius:10px;border:1.5px dashed var(--border-light);color:var(--text-muted);
  cursor:pointer;background:transparent;font-size:10.5px;
}
.img-add-tile:hover{border-color:var(--orange);color:var(--orange);}
.img-add-tile svg{width:18px;height:18px;}
.img-uploading{font-size:11px;color:var(--text-muted);padding:6px 2px;}

/* ⑤ 関連する手技 */
.tech-tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.tech-tag{
  display:flex;align-items:center;gap:7px;background:var(--orange-bg);border:1px solid rgba(232,160,32,.3);
  color:var(--orange);font-size:12px;font-weight:700;padding:7px 8px 7px 12px;border-radius:20px;
}
.tech-tag a{color:var(--orange);text-decoration:none;}
.tech-tag a:hover{text-decoration:underline;}
.tech-tag .tag-del{background:none;border:none;color:var(--orange);opacity:.55;cursor:pointer;font-size:13px;line-height:1;padding:0;}
.tech-tag .tag-del:hover{opacity:1;}

.footer-note{
  text-align:center;font-size:11px;color:var(--text-dim);margin-top:30px;line-height:1.8;
}
.footer-note img{height:16px;width:auto;display:inline-block;vertical-align:middle;opacity:.5;margin-right:5px;}

.loading-msg{text-align:center;color:var(--text-muted);font-size:12.5px;padding:30px 10px;}

/* 編集モーダル（共通：①②③編集／⑥手技選択） */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--card);border:1px solid var(--border-light);border-radius:18px 18px 0 0;
  width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;
  animation:slideUp .3s cubic-bezier(.16,1,.3,1) both;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{
  padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.modal-title{font-size:16px;font-weight:900;}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;line-height:1;padding:4px;}
.modal-scroll{overflow-y:auto;padding:18px 22px;flex:1;}
.modal-field{margin-bottom:18px;}
.modal-label{font-size:12px;color:var(--orange);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.modal-label .num{
  font-family:"JetBrains Mono",monospace;font-size:10.5px;background:var(--orange-bg);
  border:1px solid rgba(232,160,32,.25);width:20px;height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--orange);
}
.modal-textarea{
  width:100%;background:var(--black);border:1px solid var(--border-light);border-radius:9px;
  color:var(--text);font-size:13.5px;line-height:1.7;padding:12px 13px;font-family:inherit;
  resize:vertical;min-height:70px;
}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);flex-shrink:0;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));}
.modal-save-btn{
  width:100%;background:var(--orange);color:var(--black);border:none;border-radius:11px;
  padding:14px;font-family:"Bebas Neue",sans-serif;font-size:16px;letter-spacing:.05em;cursor:pointer;
}
.modal-save-btn:disabled{opacity:.5;}
.modal-error{font-size:11.5px;color:#e85050;margin-bottom:10px;display:none;text-align:center;}

.tech-select-list{display:flex;flex-direction:column;gap:2px;}
.tech-select-item{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:13.5px;cursor:pointer;}
.tech-select-item input{width:17px;height:17px;accent-color:var(--orange);flex-shrink:0;}
.tech-select-item.child{padding-left:24px;color:var(--text-muted);font-size:12.5px;}

/* 下部タブバー */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:300;
  background:rgba(20,20,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:9px 4px 8px;color:var(--text-dim);text-decoration:none;cursor:pointer;
  transition:color .15s;-webkit-tap-highlight-color:transparent;background:none;border:none;font-family:inherit;
}
.tabbar-item svg{width:21px;height:21px;}
.tabbar-item .tb-label{font-size:10px;font-weight:700;letter-spacing:.02em;}
.tabbar-item.active{color:var(--orange);}
.tabbar-item:active{opacity:.7;}
</style>

<script>
window.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    document.getElementById('splash').classList.add('hide');
  }, 500);
});

// ===================== 設定 =====================
const FIELDS = [
  { key: 'content_overview',       num: '①', label: '概要・病態' },
  { key: 'content_symptoms',       num: '②', label: '典型的な症状・背景' },
  { key: 'content_pocus_findings', num: '③', label: 'POCUSでの所見' }
];
const FIELDS2 = [
  { key: 'content_initial_response', num: '⑥', label: '初期対応' },
  { key: 'content_other',            num: '⑦', label: 'その他' }
];

const DISEASE_ID = new URLSearchParams(window.location.search).get('id');
let CURRENT_DISEASE = null;
let ALL_IMAGES = [];
let ALL_TECH_LINKS = [];   // disease_technique_links
let ALL_TECH_REGIONS = []; // technique_regions（フラット化用）
let MY_NAME = null;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function formatDate(iso){
  const d = new Date(iso);
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}

async function getMyName(){
  if(MY_NAME) return MY_NAME;
  if(!window.CURRENT_UID) return '名無しさん';
  const { data } = await _supabase.from('profiles').select('name').eq('id', window.CURRENT_UID).single();
  MY_NAME = (data && data.name) ? data.name : '名無しさん';
  return MY_NAME;
}

// ===================== 読み込み =====================
async function loadDisease(){
  if(!DISEASE_ID){
    document.getElementById('main-content').innerHTML = '<div class="loading-msg">疾患が指定されていません</div>';
    return;
  }
  const [diseaseRes, imagesRes, techLinksRes, regionsRes] = await Promise.all([
    _supabase.from('diseases').select('*').eq('id', DISEASE_ID).single(),
    _supabase.from('disease_images').select('*').eq('disease_id', DISEASE_ID).order('created_at', { ascending: true }),
    _supabase.from('disease_technique_links').select('*').eq('disease_id', DISEASE_ID),
    _supabase.from('technique_regions').select('id, parent_id, name').order('display_order', { ascending: true })
  ]);

  if(diseaseRes.error || !diseaseRes.data){
    document.getElementById('main-content').innerHTML = '<div class="loading-msg">疾患が見つかりませんでした</div>';
    return;
  }
  CURRENT_DISEASE = diseaseRes.data;
  ALL_IMAGES = imagesRes.data || [];
  ALL_TECH_LINKS = techLinksRes.data || [];
  ALL_TECH_REGIONS = regionsRes.data || [];

  document.getElementById('top-title').textContent = CURRENT_DISEASE.name;

  await renderContent();
}

function techRegionLabel(id){
  const r = ALL_TECH_REGIONS.find(x => x.id === id);
  if(!r) return '（削除済みの部位）';
  if(r.parent_id){
    const parent = ALL_TECH_REGIONS.find(x => x.id === r.parent_id);
    return (parent ? parent.name + ' > ' : '') + r.name;
  }
  return r.name;
}

async function getSignedUrl(path){
  const { data } = await _supabase.storage.from('disease-images').createSignedUrl(path, 3600);
  return data ? data.signedUrl : '';
}

// ===================== 描画 =====================
function buildFieldCard(f){
  const val = CURRENT_DISEASE[f.key];
  const bodyClass = val ? 'item-card-body' : 'item-card-body empty';
  const bodyText = val ? escapeHtml(val) : 'まだ入力されていません';
  return (
    '<div class="item-card">' +
      '<div class="item-card-head">' +
        '<div class="item-card-num mono">' + f.num + '</div>' +
        '<div class="item-card-label">' + f.label + '</div>' +
      '</div>' +
      '<div class="' + bodyClass + '">' + bodyText + '</div>' +
    '</div>'
  );
}

async function renderContent(){
  const itemsHtml = FIELDS.map(buildFieldCard).join('');
  const itemsHtml2 = FIELDS2.map(buildFieldCard).join('');

  // 画像サムネイル（署名付きURLを取得）
  const imgUrls = await Promise.all(ALL_IMAGES.map(img => getSignedUrl(img.image_path)));

  document.getElementById('main-content').innerHTML =
    '<div class="region-hero">' +
      '<div class="region-hero-title">' + escapeHtml(CURRENT_DISEASE.name) + '</div>' +
      '<div class="region-hero-desc">①〜⑦の基本情報。下の「編集する」からいつでも書き込み・修正できます。</div>' +
    '</div>' +
    '<button class="edit-fab" id="open-edit-btn">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></svg>' +
      '①②③⑥⑦を編集する' +
    '</button>' +
    itemsHtml +
    buildImageSection(imgUrls) +
    buildTechSection() +
    itemsHtml2 +
    '<div class="footer-note"><img src="assets/logo-icon-dark.png" alt="">K-PICS &nbsp;|&nbsp; 学びを、次の代へ。</div>';

  document.getElementById('open-edit-btn').addEventListener('click', openEditModal);
  attachImageHandlers();
  attachTechHandlers();
}

// ===================== ④ 所見の画像 =====================
function buildImageSection(imgUrls){
  const thumbs = ALL_IMAGES.map((img, i) => {
    const canDel = window.CURRENT_UID && img.created_by === window.CURRENT_UID;
    const delBtn = canDel ? '<button class="img-del" data-id="' + img.id + '" data-path="' + escapeHtml(img.image_path) + '">×</button>' : '';
    return (
      '<div class="img-thumb">' +
        '<img src="' + imgUrls[i] + '" alt="">' +
        delBtn +
      '</div>'
    );
  }).join('');

  const addTile =
    '<button class="img-add-tile" id="img-add-tile">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>' +
      '追加' +
    '</button>';

  return (
    '<div class="tip-section">' +
      '<div class="tip-section-head">' +
        '<div class="tip-section-title"><span class="mono" style="color:var(--orange);">④</span>所見の画像</div>' +
      '</div>' +
      '<div class="img-grid">' + thumbs + addTile + '</div>' +
      '<div id="img-uploading" class="img-uploading" style="display:none;">アップロード中…</div>' +
    '</div>'
  );
}

function attachImageHandlers(){
  const tile = document.getElementById('img-add-tile');
  const fileInput = document.getElementById('image-file-input');
  if(tile){
    tile.addEventListener('click', () => fileInput.click());
  }
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if(!file) return;
    document.getElementById('img-uploading').style.display = 'block';

    const ext = file.name.split('.').pop();
    const path = DISEASE_ID + '/' + Date.now() + '.' + ext;

    const { error: upErr } = await _supabase.storage.from('disease-images').upload(path, file);
    if(upErr){
      alert('アップロードに失敗しました：' + upErr.message);
      document.getElementById('img-uploading').style.display = 'none';
      return;
    }

    const { error: insErr } = await _supabase.from('disease_images').insert({
      disease_id: DISEASE_ID,
      image_path: path,
      created_by: window.CURRENT_UID || null
    });
    if(insErr){
      alert('登録に失敗しました：' + insErr.message);
    }

    await reloadImages();
    await renderContent();
  };

  document.querySelectorAll('.img-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('この画像を削除しますか？')) return;
      const id = btn.dataset.id;
      const path = btn.dataset.path;
      await _supabase.storage.from('disease-images').remove([path]);
      await _supabase.from('disease_images').delete().eq('id', id);
      await reloadImages();
      await renderContent();
    });
  });
}

async function reloadImages(){
  const { data } = await _supabase.from('disease_images').select('*').eq('disease_id', DISEASE_ID).order('created_at', { ascending: true });
  ALL_IMAGES = data || [];
}

// ===================== ⑤ 関連する手技 =====================
function buildTechSection(){
  const tags = ALL_TECH_LINKS.map(link => {
    return (
      '<div class="tech-tag">' +
        '<a href="technique-detail.html?id=' + link.region_id + '">' + escapeHtml(techRegionLabel(link.region_id)) + '</a>' +
        '<button class="tag-del" data-link-id="' + link.id + '">×</button>' +
      '</div>'
    );
  }).join('');

  const emptyHtml = ALL_TECH_LINKS.length === 0 ? '<div class="tip-empty">まだ関連する手技が選ばれていません</div>' : '';

  return (
    '<div class="tip-section">' +
      '<div class="tip-section-head">' +
        '<div class="tip-section-title"><span class="mono" style="color:var(--orange);">⑤</span>関連する手技</div>' +
        '<button class="tip-add-btn" id="tech-add-open">＋ 選ぶ</button>' +
      '</div>' +
      '<div class="tech-tag-list">' + tags + '</div>' +
      emptyHtml +
    '</div>'
  );
}

function attachTechHandlers(){
  const openBtn = document.getElementById('tech-add-open');
  if(openBtn) openBtn.addEventListener('click', openTechModal);

  document.querySelectorAll('.tag-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      await _supabase.from('disease_technique_links').delete().eq('id', btn.dataset.linkId);
      const { data } = await _supabase.from('disease_technique_links').select('*').eq('disease_id', DISEASE_ID);
      ALL_TECH_LINKS = data || [];
      await renderContent();
    });
  });
}

function openTechModal(){
  const selectedIds = ALL_TECH_LINKS.map(l => l.region_id);
  const topLevel = ALL_TECH_REGIONS.filter(r => !r.parent_id);

  const html = topLevel.map(parent => {
    const children = ALL_TECH_REGIONS.filter(r => r.parent_id === parent.id);
    const parentRow =
      '<label class="tech-select-item">' +
        '<input type="checkbox" value="' + parent.id + '" ' + (selectedIds.includes(parent.id) ? 'checked' : '') + '>' +
        escapeHtml(parent.name) +
      '</label>';
    const childRows = children.map(c =>
      '<label class="tech-select-item child">' +
        '<input type="checkbox" value="' + c.id + '" ' + (selectedIds.includes(c.id) ? 'checked' : '') + '>' +
        escapeHtml(c.name) +
      '</label>'
    ).join('');
    return parentRow + childRows;
  }).join('');

  document.getElementById('tech-select-list').innerHTML = html || '<div class="tip-empty">エコー手技マスターに部位が登録されていません</div>';
  document.getElementById('tech-error').style.display = 'none';
  document.getElementById('tech-modal').classList.add('show');
}

document.getElementById('tech-modal-close').addEventListener('click', () => {
  document.getElementById('tech-modal').classList.remove('show');
});

document.getElementById('tech-save-btn').addEventListener('click', async () => {
  const checked = Array.from(document.querySelectorAll('#tech-select-list input[type="checkbox"]:checked')).map(i => i.value);
  const before = ALL_TECH_LINKS.map(l => l.region_id);

  const toAdd = checked.filter(id => !before.includes(id));
  const toRemove = ALL_TECH_LINKS.filter(l => !checked.includes(l.region_id));

  const btn = document.getElementById('tech-save-btn');
  btn.disabled = true; btn.textContent = '保存中…';

  try{
    if(toAdd.length > 0){
      const rows = toAdd.map(region_id => ({ disease_id: DISEASE_ID, region_id: region_id, created_by: window.CURRENT_UID || null }));
      const { error } = await _supabase.from('disease_technique_links').insert(rows);
      if(error) throw error;
    }
    if(toRemove.length > 0){
      const ids = toRemove.map(l => l.id);
      const { error } = await _supabase.from('disease_technique_links').delete().in('id', ids);
      if(error) throw error;
    }
  } catch(error){
    btn.disabled = false; btn.textContent = '保存する';
    const errEl = document.getElementById('tech-error');
    errEl.textContent = '保存に失敗しました：' + error.message;
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = false; btn.textContent = '保存する';

  const { data } = await _supabase.from('disease_technique_links').select('*').eq('disease_id', DISEASE_ID);
  ALL_TECH_LINKS = data || [];

  document.getElementById('tech-modal').classList.remove('show');
  await renderContent();
});

// ===================== ①②③⑥⑦編集モーダル =====================
function openEditModal(){
  const fieldsHtml = FIELDS.concat(FIELDS2).map(f => {
    const val = CURRENT_DISEASE[f.key] || '';
    return (
      '<div class="modal-field">' +
        '<div class="modal-label"><span class="num mono">' + f.num + '</span>' + f.label + '</div>' +
        '<textarea class="modal-textarea" data-key="' + f.key + '" rows="3">' + escapeHtml(val) + '</textarea>' +
      '</div>'
    );
  }).join('');
  document.getElementById('modal-fields').innerHTML = fieldsHtml;
  document.getElementById('edit-error').style.display = 'none';
  document.getElementById('edit-modal').classList.add('show');
}

document.getElementById('edit-modal-close').addEventListener('click', () => {
  document.getElementById('edit-modal').classList.remove('show');
});

document.getElementById('edit-save-btn').addEventListener('click', async () => {
  const textareas = document.querySelectorAll('#modal-fields .modal-textarea');
  const updates = {};
  textareas.forEach(ta => { updates[ta.dataset.key] = ta.value.trim(); });
  updates.updated_at = new Date().toISOString();

  const btn = document.getElementById('edit-save-btn');
  btn.disabled = true;
  btn.textContent = '保存中…';

  const { error } = await _supabase
    .from('diseases')
    .update(updates)
    .eq('id', DISEASE_ID);

  btn.disabled = false;
  btn.textContent = '保存する';

  if(error){
    const errEl = document.getElementById('edit-error');
    errEl.textContent = '保存に失敗しました：' + error.message;
    errEl.style.display = 'block';
    return;
  }

  Object.assign(CURRENT_DISEASE, updates);
  document.getElementById('edit-modal').classList.remove('show');
  renderContent();
});

loadDisease();
</script>
