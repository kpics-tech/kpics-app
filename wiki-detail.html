<script>
window.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){ document.getElementById('splash').classList.add('hide'); }, 500);
});

// ===================== 認証：コアメンバー判定 =====================
// auth-guard.js が window.CURRENT_UID をセットするのに合わせて、
// このページ独自にコアメンバー判定も取得しておく（calendar.js と同じ考え方）。
let CURRENT_IS_CORE = false;
_supabase.auth.onAuthStateChange((event, session) => {
  if(session && session.user){
    _supabase.from('profiles').select('is_core_member').eq('id', session.user.id).single().then(({data}) => {
      CURRENT_IS_CORE = !!(data && data.is_core_member);
    });
  }
});

// ===================== 設定 =====================
const TERM_ID = new URLSearchParams(window.location.search).get('id');
let CURRENT_TERM = null;
let ALL_ENTRIES = [];
let ALL_IMAGES = [];      // entry_images: {id, entry_id, storage_path, uploaded_by}
let IMAGE_URL_MAP = {};
let BADGE_MAP = {};       // user_id -> {is_teacher, is_core_member, is_certified}
let MY_NAME = null;
let ADDING_ENTRY = false;
let EDITING_ENTRY_ID = null;
let CURRENT_UPLOAD_TARGET = null; // { entryId }

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function formatDate(iso){
  const d = new Date(iso);
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
async function getMyName(){
  if(MY_NAME) return MY_NAME;
  if(!window.CURRENT_UID) return '名無しさん';
  const { data } = await _supabase.from('profiles').select('name').eq('id', window.CURRENT_UID).single();
  MY_NAME = (data && data.name) ? data.name : '名無しさん';
  return MY_NAME;
}

// ---- バッジ（先生/コア/認定） ----
async function ensureBadges(userIds){
  const need = [...new Set(userIds)].filter(id => id && !(id in BADGE_MAP));
  if(need.length === 0) return;
  const { data, error } = await _supabase
    .from('profiles')
    .select('id,is_teacher,is_core_member,is_certified')
    .in('id', need);
  if(error){ console.error('バッジ取得エラー', error); return; }
  (data || []).forEach(p => { BADGE_MAP[p.id] = p; });
}
function badgesHtml(userId){
  const b = BADGE_MAP[userId];
  if(!b) return '';
  let html = '';
  if(b.is_teacher)     html += '<span class="imp-badge b-teacher">先生</span>';
  if(b.is_core_member) html += '<span class="imp-badge b-core">コア</span>';
  if(b.is_certified)   html += '<span class="imp-badge b-certified">認定</span>';
  return html ? '<span class="imp-badges">' + html + '</span>' : '';
}

// ===================== 画像圧縮（無料枠対策） =====================
async function compressImage(file, maxEdge, quality){
  maxEdge = maxEdge || 1600;
  quality = quality || 0.8;
  const img = await createImageBitmap(file);
  const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const canvas = Object.assign(document.createElement('canvas'), { width: w, height: h });
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
  return new File([blob], (file.name.replace(/\.[^.]+$/, '') || 'img') + '.jpg', { type: 'image/jpeg' });
}

// ===================== データ読み込み =====================
async function loadTerm(){
  if(!TERM_ID){
    document.getElementById('main-content').innerHTML = '<div class="loading-msg">用語が指定されていません</div>';
    return;
  }
  const [{ data, error }, entriesRes] = await Promise.all([
    _supabase.from('wiki_terms').select('*').eq('id', TERM_ID).single(),
    _supabase.from('wiki_entries').select('*').eq('term_id', TERM_ID).order('created_at', { ascending: true })
  ]);

  if(error || !data){
    document.getElementById('main-content').innerHTML = '<div class="loading-msg">用語が見つかりませんでした</div>';
    return;
  }
  CURRENT_TERM = data;
  ALL_ENTRIES = entriesRes.data || [];
  document.getElementById('top-title').textContent = data.term;

  await reloadImagesAndUrls();
  await ensureBadges([data.created_by, ...ALL_ENTRIES.map(e => e.author_id)]);

  renderContent();
}

async function reloadImagesAndUrls(){
  const entryIds = ALL_ENTRIES.map(e => e.id);
  if(entryIds.length === 0){ ALL_IMAGES = []; return; }
  const { data } = await _supabase
    .from('wiki_images')
    .select('*')
    .in('entry_id', entryIds)
    .order('created_at', { ascending: true });
  ALL_IMAGES = data || [];

  await Promise.all(ALL_IMAGES.map(async img => {
    if(IMAGE_URL_MAP[img.storage_path]) return;
    const { data: sd } = await _supabase.storage.from('wiki-images').createSignedUrl(img.storage_path, 3600);
    if(sd) IMAGE_URL_MAP[img.storage_path] = sd.signedUrl;
  }));
}

// ===================== 描画 =====================
function renderContent(){
  const t = CURRENT_TERM;
  const canEditTerm = window.CURRENT_UID && (t.created_by === window.CURRENT_UID || CURRENT_IS_CORE);

  const heroHtml =
    '<div class="term-hero">' +
      (t.reading ? '<div class="term-hero-reading">' + escapeHtml(t.reading) + '</div>' : '') +
      '<div class="term-hero-title">' + escapeHtml(t.term) + '</div>' +
      '<div class="term-hero-meta">' +
        (t.category ? '<span class="term-cat-badge">' + escapeHtml(t.category) + '</span>' : '') +
        '<span class="term-author">' + escapeHtml(t.created_by_name || '名無しさん') + ' が登録</span>' +
      '</div>' +
      (canEditTerm ?
        '<div class="term-actions">' +
          '<button class="term-action-btn" id="term-edit-open-btn">用語を編集</button>' +
          '<button class="term-action-btn danger" id="term-delete-btn">用語を削除</button>' +
        '</div>'
      : '') +
    '</div>';

  const entriesHtml = ALL_ENTRIES.map(e => {
    if(EDITING_ENTRY_ID === e.id) return buildEditEntryForm(e);
    const canEdit = window.CURRENT_UID && (e.author_id === window.CURRENT_UID || CURRENT_IS_CORE);
    const actions = canEdit
      ? '<div class="entry-card-actions">' +
          '<button class="entry-card-action" onclick="startEditEntry(\'' + e.id + '\')">編集</button>' +
          '<button class="entry-card-action danger" onclick="deleteEntry(\'' + e.id + '\')">削除</button>' +
        '</div>'
      : '';
    return (
      '<div class="entry-card">' +
        buildImageSection(e.id, false) +
        '<div class="entry-card-text">' + escapeHtml(e.content) + '</div>' +
        '<div class="entry-card-foot">' +
          '<div class="entry-card-author">' + escapeHtml(e.author_name || '名無しさん') + badgesHtml(e.author_id) + '<span>・' + formatDate(e.created_at) + '</span></div>' +
          actions +
        '</div>' +
      '</div>'
    );
  }).join('');

  const emptyHtml = (ALL_ENTRIES.length === 0 && !ADDING_ENTRY)
    ? '<div class="entry-empty">まだ解説が投稿されていません。<br>知っていることがあれば、ぜひ最初の解説を書いてみましょう。</div>' : '';

  const addForm = ADDING_ENTRY ? buildAddEntryForm() : '';
  const addBtn = ADDING_ENTRY ? '' : '<button class="entry-add-btn" id="entry-add-open-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>解説を追加</button>';

  document.getElementById('main-content').innerHTML =
    heroHtml +
    '<div class="entry-section-head">' +
      '<div class="entry-section-title">解説（' + ALL_ENTRIES.length + '）</div>' +
      addBtn +
    '</div>' +
    addForm + emptyHtml + entriesHtml +
    '<div class="footer-note"><img src="assets/logo-icon-dark.png" alt="">K-PICS &nbsp;|&nbsp; 学びを、次の代へ。</div>';

  if(canEditTerm){
    document.getElementById('term-edit-open-btn').addEventListener('click', openTermEditModal);
    document.getElementById('term-delete-btn').addEventListener('click', deleteTerm);
  }
  const openBtn = document.getElementById('entry-add-open-btn');
  if(openBtn) openBtn.addEventListener('click', openAddEntry);

  // ADDING/EDITING フォームの中の要素にイベントを再接続
  wireFormEvents();
}

function wireFormEvents(){
  if(ADDING_ENTRY){
    const cancelBtn = document.getElementById('add-entry-cancel-btn');
    const saveBtn = document.getElementById('add-entry-save-btn');
    if(cancelBtn) cancelBtn.addEventListener('click', cancelAddEntry);
    if(saveBtn) saveBtn.addEventListener('click', submitNewEntry);
  }
  if(EDITING_ENTRY_ID){
    const cancelBtn = document.getElementById('edit-entry-cancel-btn');
    const saveBtn = document.getElementById('edit-entry-save-btn');
    if(cancelBtn) cancelBtn.addEventListener('click', cancelEditEntry);
    if(saveBtn) saveBtn.addEventListener('click', () => saveEditEntry(EDITING_ENTRY_ID));
  }
}

// ===================== 画像セクション =====================
function buildImageSection(entryId, editable){
  const imgs = ALL_IMAGES.filter(i => i.entry_id === entryId);
  const itemsHtml = imgs.map(img => {
    const url = IMAGE_URL_MAP[img.storage_path] || '';
    const delBtn = editable
      ? '<button class="entry-img-del" onclick="event.stopPropagation();deleteEntryImage(\'' + img.id + '\',\'' + img.storage_path + '\')">&times;</button>'
      : '';
    return (
      '<div class="entry-img-item">' +
        '<img src="' + url + '" alt="" onclick="openLightbox(\'' + url + '\')">' +
        delBtn +
      '</div>'
    );
  }).join('');

  const addBtn = (editable && imgs.length < 3)
    ? '<button class="entry-img-add-btn" onclick="startImageUpload(\'' + entryId + '\')">＋ 画像を追加（' + imgs.length + '/3）</button>'
    : '';

  if(!itemsHtml && !addBtn) return '';

  return (
    '<div class="entry-img-section" id="imgsec-' + entryId + '">' +
      (itemsHtml ? '<div class="entry-img-list">' + itemsHtml + '</div>' : '') +
      '<div class="entry-img-uploading" id="img-uploading-' + entryId + '" style="display:none;">アップロード中…（圧縮しています）</div>' +
      addBtn +
    '</div>'
  );
}

function startImageUpload(entryId){
  CURRENT_UPLOAD_TARGET = { entryId: entryId };
  document.getElementById('image-file-input').click();
}

document.getElementById('image-file-input').addEventListener('change', async () => {
  const fileInput = document.getElementById('image-file-input');
  const file = fileInput.files[0];
  fileInput.value = '';
  if(!file || !CURRENT_UPLOAD_TARGET) return;

  const entryId = CURRENT_UPLOAD_TARGET.entryId;
  const existing = ALL_IMAGES.filter(i => i.entry_id === entryId);
  if(existing.length >= 3){ alert('画像は3枚まで追加できます'); return; }

  const uploadingEl = document.getElementById('img-uploading-' + entryId);
  if(uploadingEl) uploadingEl.style.display = 'block';

  let uploadFile;
  try{
    uploadFile = await compressImage(file);
  } catch(e){
    console.error('圧縮に失敗しました。元画像をアップロードします', e);
    uploadFile = file;
  }

  const path = 'wiki/' + TERM_ID + '/' + entryId + '/' + Date.now() + '.jpg';

  const { error: upErr } = await _supabase.storage.from('wiki-images').upload(path, uploadFile);
  if(upErr){
    alert('アップロードに失敗しました：' + upErr.message);
    if(uploadingEl) uploadingEl.style.display = 'none';
    return;
  }

  const { error: insErr } = await _supabase.from('wiki_images').insert({
    entry_id: entryId,
    storage_path: path,
    uploaded_by: window.CURRENT_UID || null
  });
  if(insErr){
    alert('登録に失敗しました：' + insErr.message);
  }

  await reloadImagesAndUrls();
  renderContent();
});

async function deleteEntryImage(id, path){
  if(!confirm('この画像を削除しますか？')) return;
  await _supabase.storage.from('wiki-images').remove([path]);
  await _supabase.from('wiki_images').delete().eq('id', id);
  delete IMAGE_URL_MAP[path];
  await reloadImagesAndUrls();
  renderContent();
}

function openLightbox(url){
  if(!url) return;
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-overlay').classList.add('show');
}
document.getElementById('lightbox-overlay').addEventListener('click', () => {
  document.getElementById('lightbox-overlay').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
});

// ===================== 解説の追加・編集・削除 =====================
function buildAddEntryForm(){
  return (
    '<div class="entry-form" id="add-entry-form">' +
      '<div class="entry-form-error" id="add-entry-error">投稿に失敗しました</div>' +
      '<textarea class="entry-textarea" id="add-entry-textarea" placeholder="この用語について、知っていることを書いてください"></textarea>' +
      '<div class="entry-form-actions">' +
        '<button class="entry-form-btn cancel" id="add-entry-cancel-btn">キャンセル</button>' +
        '<button class="entry-form-btn save" id="add-entry-save-btn">投稿する</button>' +
      '</div>' +
    '</div>'
  );
}

function openAddEntry(){
  ADDING_ENTRY = true;
  EDITING_ENTRY_ID = null;
  renderContent();
  setTimeout(() => { const ta = document.getElementById('add-entry-textarea'); if(ta) ta.focus(); }, 0);
}
function cancelAddEntry(){ ADDING_ENTRY = false; renderContent(); }

async function submitNewEntry(){
  const ta = document.getElementById('add-entry-textarea');
  const content = ta.value.trim();
  const errEl = document.getElementById('add-entry-error');
  if(!content){
    errEl.textContent = '内容を入力してください';
    errEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('add-entry-save-btn');
  btn.disabled = true; btn.textContent = '投稿中…';

  const name = await getMyName();
  const { error } = await _supabase.from('wiki_entries').insert({
    term_id: TERM_ID,
    content: content,
    author_name: name,
    author_id: window.CURRENT_UID || null
  });

  if(error){
    btn.disabled = false; btn.textContent = '投稿する';
    errEl.textContent = '投稿に失敗しました：' + error.message;
    errEl.style.display = 'block';
    return;
  }

  ADDING_ENTRY = false;
  await reloadEntries();
  renderContent();
}

function buildEditEntryForm(e){
  return (
    '<div class="entry-card">' +
      buildImageSection(e.id, true) +
      '<div class="entry-form" style="margin-bottom:0;">' +
        '<div class="entry-form-error" id="edit-entry-error-' + e.id + '">保存に失敗しました</div>' +
        '<textarea class="entry-textarea" id="edit-entry-textarea">' + escapeHtml(e.content) + '</textarea>' +
        '<div class="entry-form-actions">' +
          '<button class="entry-form-btn cancel" id="edit-entry-cancel-btn">キャンセル</button>' +
          '<button class="entry-form-btn save" id="edit-entry-save-btn">保存する</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function startEditEntry(id){ EDITING_ENTRY_ID = id; ADDING_ENTRY = false; renderContent(); }
function cancelEditEntry(){ EDITING_ENTRY_ID = null; renderContent(); }

async function saveEditEntry(id){
  const ta = document.getElementById('edit-entry-textarea');
  const content = ta.value.trim();
  const errEl = document.getElementById('edit-entry-error-' + id);
  if(!content){
    errEl.textContent = '内容を入力してください';
    errEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('edit-entry-save-btn');
  btn.disabled = true; btn.textContent = '保存中…';

  const { error } = await _supabase.from('wiki_entries')
    .update({ content: content, updated_at: new Date().toISOString() })
    .eq('id', id);

  if(error){
    btn.disabled = false; btn.textContent = '保存する';
    errEl.textContent = '保存に失敗しました：' + error.message;
    errEl.style.display = 'block';
    return;
  }

  EDITING_ENTRY_ID = null;
  await reloadEntries();
  renderContent();
}

async function deleteEntry(id){
  if(!confirm('この解説を削除しますか？（画像も一緒に削除されます）')) return;
  const imgs = ALL_IMAGES.filter(i => i.entry_id === id);
  if(imgs.length){
    await _supabase.storage.from('wiki-images').remove(imgs.map(i => i.storage_path));
  }
  const { error } = await _supabase.from('wiki_entries').delete().eq('id', id);
  if(error){ alert('削除に失敗しました：' + error.message); return; }
  await reloadEntries();
  renderContent();
}

async function reloadEntries(){
  const { data } = await _supabase
    .from('wiki_entries')
    .select('*')
    .eq('term_id', TERM_ID)
    .order('created_at', { ascending: true });
  ALL_ENTRIES = data || [];
  await reloadImagesAndUrls();
  await ensureBadges(ALL_ENTRIES.map(e => e.author_id));
}

// ===================== 用語の編集・削除 =====================
function openTermEditModal(){
  document.getElementById('term-edit-input').value = CURRENT_TERM.term || '';
  document.getElementById('reading-edit-input').value = CURRENT_TERM.reading || '';
  document.getElementById('category-edit-input').value = CURRENT_TERM.category || '';
  document.getElementById('term-edit-error').style.display = 'none';
  document.getElementById('term-edit-modal').classList.add('show');
}
document.getElementById('term-edit-cancel-btn').addEventListener('click', () => {
  document.getElementById('term-edit-modal').classList.remove('show');
});
document.getElementById('term-edit-save-btn').addEventListener('click', async () => {
  const term = document.getElementById('term-edit-input').value.trim();
  const reading = document.getElementById('reading-edit-input').value.trim();
  const category = document.getElementById('category-edit-input').value;
  const errEl = document.getElementById('term-edit-error');
  if(!term){
    errEl.textContent = '用語を入力してください';
    errEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('term-edit-save-btn');
  btn.disabled = true; btn.textContent = '保存中…';

  const { error } = await _supabase.from('wiki_terms').update({
    term: term,
    reading: reading || null,
    category: category || null,
    updated_at: new Date().toISOString()
  }).eq('id', TERM_ID);

  btn.disabled = false; btn.textContent = '保存する';

  if(error){
    errEl.textContent = '保存に失敗しました：' + error.message;
    errEl.style.display = 'block';
    return;
  }

  Object.assign(CURRENT_TERM, { term, reading: reading || null, category: category || null });
  document.getElementById('term-edit-modal').classList.remove('show');
  document.getElementById('top-title').textContent = term;
  renderContent();
});

async function deleteTerm(){
  if(!confirm('この用語を削除しますか？すべての解説・画像も一緒に削除されます。')) return;
  if(ALL_IMAGES.length){
    await _supabase.storage.from('wiki-images').remove(ALL_IMAGES.map(i => i.storage_path));
  }
  const { error } = await _supabase.from('wiki_terms').delete().eq('id', TERM_ID);
  if(error){ alert('削除に失敗しました：' + error.message); return; }
  window.location.href = 'wiki.html';
}

loadTerm();
</script>
