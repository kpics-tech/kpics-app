*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--black);}
body{color:var(--text);font-family:"Noto Sans JP",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:var(--black);z-index:900;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s ease, visibility .45s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo-img{width:110px;animation:scaleIn .5s cubic-bezier(.16,1,.3,1) both;filter:drop-shadow(0 8px 30px rgba(232,160,32,.25));}

/* HEADER */
.top-header{

  padding:env(safe-area-inset-top) 16px 0;
}
.top-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;height:54px;gap:12px;}
.back-btn{
  display:flex;align-items:center;gap:5px;color:var(--text-muted);text-decoration:none;
  font-size:12.5px;font-weight:600;transition:color .15s;white-space:nowrap;
}
.back-btn:hover{color:var(--orange);}
.top-title{flex:1;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:.05em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-logo{height:24px;width:auto;flex-shrink:0;}

.main{max-width:640px;margin:0 auto;padding:30px 20px 90px;}

.doc-hero{text-align:center;padding:18px 10px 28px;}
.doc-hero-icon{
  width:64px;height:64px;border-radius:16px;background:var(--orange-bg);border:1px solid rgba(232,160,32,.25);
  display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;
}
.doc-hero-title{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:21px;line-height:1.5;margin-bottom:10px;}
.doc-hero-desc{font-size:12.5px;color:var(--text-muted);line-height:1.85;max-width:420px;margin:0 auto;}

/* 部位カード */
.region-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.region-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:17px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  text-decoration:none;color:var(--text);transition:all .15s;
}
.region-card:hover{background:var(--card-hover);border-color:var(--border-light);}
.region-card:active{transform:scale(.98);}
.region-card-num{
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--orange);
  background:var(--orange-bg);border:1px solid rgba(232,160,32,.25);
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.region-card-body{flex:1;min-width:0;}
.region-card-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.region-card-sub{font-size:11px;color:var(--text-muted);}
.region-card-chevron{color:var(--text-dim);flex-shrink:0;}
.region-card-chevron svg{width:18px;height:18px;}

.loading-msg, .empty-msg{
  text-align:center;color:var(--text-muted);font-size:12.5px;padding:30px 10px;
}

/* 追加ボタン */
.add-region-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:transparent;border:1.5px dashed var(--border-light);color:var(--text-muted);
  border-radius:14px;padding:16px;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s;
}
.add-region-btn:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-bg);}
.add-region-btn svg{width:17px;height:17px;}

.doc-note{
  font-size:11.5px;color:var(--text-dim);line-height:1.8;text-align:center;
  background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-top:18px;
}
.doc-note strong{color:var(--text-muted);}

.footer-note{
  text-align:center;font-size:11px;color:var(--text-dim);margin-top:40px;line-height:1.8;
}
.footer-note img{height:16px;width:auto;display:inline-block;vertical-align:middle;opacity:.5;margin-right:5px;}

/* モーダル */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--card);border:1px solid var(--border-light);border-radius:16px;
  width:100%;max-width:380px;padding:24px 22px;animation:scaleIn .25s cubic-bezier(.16,1,.3,1) both;
}
.modal-title{font-size:16px;font-weight:900;margin-bottom:18px;}
.modal-label{font-size:11.5px;color:var(--text-muted);font-weight:700;margin-bottom:7px;display:block;}
.modal-input, .modal-select{
  width:100%;background:var(--black);border:1px solid var(--border-light);border-radius:9px;
  color:var(--text);font-size:14px;padding:11px 13px;margin-bottom:16px;font-family:inherit;
}
.modal-select{appearance:none;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-btn{
  flex:1;border:none;border-radius:9px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.modal-btn.cancel{background:transparent;border:1px solid var(--border-light);color:var(--text-muted);}
.modal-btn.confirm{background:var(--orange);color:var(--black);}
.modal-btn.confirm:disabled{opacity:.5;}
.modal-error{font-size:11.5px;color:#e85050;margin:-8px 0 14px;display:none;}

/* 下部タブバー */
.tabbar{

.tabbar-item{

<script>
window.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    document.getElementById('splash').classList.add('hide');
  }, 500);
});

// ===================== データ取得・一覧表示 =====================
const urlParams = new URLSearchParams(window.location.search);
const PARENT_ID = urlParams.get('parent'); // nullなら最上位一覧

let ALL_REGIONS = [];

async function loadRegions(){
  const { data, error } = await _supabase
    .from('technique_regions')
    .select('id, parent_id, name, display_order')
    .order('display_order', { ascending: true });

  if(error){
    document.getElementById('region-list').innerHTML =
      '<div class="empty-msg">読み込みに失敗しました：' + error.message + '</div>';
    return;
  }
  ALL_REGIONS = data || [];
  renderList();
  fillParentSelect();
}

function getChildren(id){
  return ALL_REGIONS.filter(r => r.parent_id === id);
}

function renderList(){
  const listEl = document.getElementById('region-list');

  let targetRegions;
  if(PARENT_ID){
    const parent = ALL_REGIONS.find(r => r.id === PARENT_ID);
    targetRegions = getChildren(PARENT_ID);
    document.getElementById('top-title').textContent = parent ? parent.name : '予習教材';
    document.getElementById('back-btn').setAttribute('href', 'prep.html');
    document.getElementById('back-label').textContent = '部位一覧';
    document.getElementById('hero-block').style.display = 'none';
  } else {
    targetRegions = ALL_REGIONS.filter(r => !r.parent_id);
    document.getElementById('top-title').textContent = '予習教材';
    document.getElementById('back-btn').setAttribute('href', 'manabu.html');
    document.getElementById('back-label').textContent = 'ホーム';
    document.getElementById('hero-block').style.display = '';
  }

  if(targetRegions.length === 0){
    listEl.innerHTML = '<div class="empty-msg">まだ部位が登録されていません</div>';
    return;
  }

  listEl.innerHTML = targetRegions.map((r, i) => {
    const childCount = getChildren(r.id).length;
    const sub = childCount > 0 ? childCount + '件の項目' : '①〜⑨の詳細を見る';
    const href = childCount > 0
      ? 'technique.html?parent=' + r.id
      : 'prep-detail.html?id=' + r.id;
    return (
      '<a class="region-card" href="' + href + '">' +
        '<div class="region-card-num mono">' + String(i+1).padStart(2,'0') + '</div>' +
        '<div class="region-card-body">' +
          '<div class="region-card-name">' + escapeHtml(r.name) + '</div>' +
          '<div class="region-card-sub">' + sub + '</div>' +
        '</div>' +
        '<div class="region-card-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>' +
      '</a>'
    );
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}


loadRegions();
</script>
